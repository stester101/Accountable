plugins { id 'com.android.application' }

// The web app is the single source of truth: index.html and vendor/ at the repo root are
// copied into the APK's assets at build time, so there is no second copy to keep in sync.
def webAssets = layout.buildDirectory.dir('generated/webassets')
tasks.register('copyWebAssets', Copy) {
  from(rootProject.file('index.html'))
  from(rootProject.file('vendor')) { into 'vendor' }
  into webAssets
}

android {
  namespace 'com.accountable.tracker'
  compileSdk 35
  defaultConfig {
    applicationId 'com.accountable.tracker'
    minSdk 26
    targetSdk 35
    versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
    versionName '1.0.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
  }
  signingConfigs {
    debug {
      storeFile rootProject.file('.signing/accountable-debug.keystore')
      storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android'
    }
  }
  sourceSets { main { assets.srcDir webAssets } }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
tasks.matching { it.name.startsWith('merge') && it.name.endsWith('Assets') }.configureEach { dependsOn 'copyWebAssets' }

dependencies {
  implementation 'androidx.core:core:1.13.1'
  implementation 'androidx.webkit:webkit:1.12.1'
}
