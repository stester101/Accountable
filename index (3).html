/* ── date utils (LOCAL time) ── */
const pad = (n) => String(n).padStart(2,"0");
const fmtKey = (d) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const keyToDate = (key) => {
  if (!key || typeof key !== "string") return new Date();
  const [y,m,d] = key.split("-").map(Number);
  return new Date(y, m-1, d);
};
const addDays = (key, n) => { const d = keyToDate(key); d.setDate(d.getDate()+n); return fmtKey(d); };
const todayKey = () => fmtKey(new Date());
const dow = (key) => keyToDate(key).getDay(); // 0 Sun .. 6 Sat
const fmtPretty = (key) => keyToDate(key).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});
const fmtShort = (key) => keyToDate(key).toLocaleDateString("en-GB",{day:"numeric",month:"short"});
const fmtDow = (key) => keyToDate(key).toLocaleDateString("en-GB",{weekday:"narrow"});
const monthLabel = (y,m) => new Date(y,m,1).toLocaleDateString("en-GB",{month:"long",year:"numeric"});
const weekStartKey = (key) => { const d=keyToDate(key); const off=(d.getDay()+6)%7; d.setDate(d.getDate()-off); return fmtKey(d); };
const weekDays = (key) => { const ws=weekStartKey(key); return Array.from({length:7},(_,i)=>addDays(ws,i)); };

/* ── goal helpers ── */
const ICONS = {food:UtensilsCrossed,water:Droplets,steps:Footprints,cigs:Cigarette,coffee:Coffee,softdrink:CupSoda,sleep:Moon,gym:Dumbbell,custom:Sparkles};
const GoalIcon = (g) => ICONS[g.icon] || NAMED_ICONS[g.icon] || Sparkles;
const NAMED_ICONS = {Sparkles,Heart,Dumbbell,UtensilsCrossed,Moon,Leaf,Star,DollarSign,Droplets,Footprints,Coffee,Activity,Brain,Target,Flame};
const CatIcon = (name) => NAMED_ICONS[name] || Sparkles;
const DEFAULT_CATS = [

  {name:"Health",icon:"Heart",enabled:true},
  {name:"Sleep",icon:"Moon",enabled:true},
  {name:"General",icon:"Sparkles",enabled:true},

const makeGoal = (id,label,unit,type,icon,targetHistory,step=1,extra={}) => ({
  id,label,unit,type,icon,targetHistory,step,bufferPct:undefined,
  category: extra.category || "General",
  accent: extra.accent || null,
  cadence: extra.cadence || "daily",     // daily | weekdays | weekends | custom | weekly
  days: extra.days || [1,2,3,4,5],        // for custom (0=Sun..6=Sat)
  weeklyCount: extra.weeklyCount || 3,
  startDate: extra.startDate || targetHistory[0].date,
  parentId: extra.parentId || null,
});
/* sub-goals: a goal with parentId nests under its parent and is excluded from
   day-completion scoring (it still charts, exports and tracks streaks normally) */
const isSub = (g) => !!g.parentId;
const topLevel = (gs) => gs.filter(g=>!g.parentId);
const childrenOf = (gs,id) => gs.filter(g=>g.parentId===id);
const defaultBuffer = (type) => type==="max" ? 25 : 30;

/* ── macro sub-goals under Food (seeded once) ── */
const MACRO_DEFS = [
  ["protein","Protein","g","min","Dumbbell",150,5,"#6B8F71"],
  ["carbs","Carbs (excl. sugars)","g","max","Flame",100,5,"#C15B3C"],
  ["sugars","Added sugars","g","max","Star",20,1,"#9B6A9E"],
  ["sugars-nat","Natural sugars","g","max","Heart",30,1,"#C9A227"],
  ["fat","Fat","g","max","Droplets",60,1,"#E8A33D"],
  ["fibre","Fibre","g","min","Leaf",30,1,"#4F7CAC"],
];
function macroGoals(startKey){
  return MACRO_DEFS.map(([id,label,unit,type,icon,target,step,accent])=>
    makeGoal(id,label,unit,type,icon,[{date:startKey,value:target}],step,
      {category:"Diet",accent,parentId:"food",startDate:startKey}));
}
/* old saved charts were pinned to fixed dates; roll them into a moving window
   of the same length so they keep updating */
function withRollingCharts(st){
  if(!st || st.chartsMigrated) return st;
  const sc=(st.savedCharts||[]).map(c=>{
    const s=c.sel||{};
    if(s.range!=="custom"||!s.from||!s.to) return c;
    const days=Math.max(1,Math.round((keyToDate(s.to)-keyToDate(s.from))/86400000)+1);
    return {...c,sel:{...s,range:"rel",days,includeToday:false}};
  });
  return {...st,savedCharts:sc,chartsMigrated:true};
}
function retarget(g,value,today){
  const th=[...(g.targetHistory||[]).filter(t=>t.date!==today),{date:today,value}].sort((a,b)=>a.date<b.date?-1:1);
  return {...g,targetHistory:th};
}
function withSugarSplit(st){
  if(!st || st.sugarSplit) return st;
  const T=todayKey();
  let gs=(st.goals||[]).map(g=>{
    if(g.id==="carbs" && targetForDate(g,T)===150) return retarget({...g,label:"Carbs (excl. sugars)"},100,T);
    if(g.id==="sugars" && targetForDate(g,T)===50) return retarget({...g,label:"Added sugars"},20,T);
    return g;
  });
  if(gs.some(g=>g.id==="sugars") && !gs.some(g=>g.id==="sugars-nat")){
    const d=MACRO_DEFS.find(m=>m[0]==="sugars-nat");
    const nat=makeGoal(d[0],d[1],d[2],d[3],d[4],[{date:T,value:d[5]}],d[6],{category:"Diet",accent:d[7],parentId:"food",startDate:T});
    const i=gs.findIndex(g=>g.id==="sugars");
    gs=[...gs.slice(0,i+1),nat,...gs.slice(i+1)];
  }
  return {...st,goals:gs,sugarSplit:true};
}
function withMacros(st){
  if(!st || st.macrosSeeded) return st;
  const gs=st.goals||[];
  if(!gs.some(g=>g.id==="food")) return {...st,macrosSeeded:true};
  const have=new Set(gs.map(g=>g.id));
  const add=macroGoals(todayKey()).filter(g=>!have.has(g.id));
  const i=gs.findIndex(g=>g.id==="food");
  return {...st, goals:[...gs.slice(0,i+1),...add,...gs.slice(i+1)], macrosSeeded:true};
}

const isWeekly = (g) => g.cadence==="weekly";
const isActiveDay = (g,key) => {
  const d = dow(key);
  switch(g.cadence){
    case "weekdays": return d>=1 && d<=5;
    case "weekends": return d===0 || d===6;
    case "custom":   return (g.days||[]).includes(d);
    case "weekly":   return true;
    default:         return true;
  }
};
const cadenceLabel = (g) => {
  switch(g.cadence){
    case "weekdays": return "Weekdays";
    case "weekends": return "Weekends";
    case "custom":   return (g.days||[]).length===7 ? "Every day" : (g.days||[]).map(d=>["Su","Mo","Tu","We","Th","Fr","Sa"][d]).join(" ");
    case "weekly":   return `${g.weeklyCount}× / week`;
    default:         return "Every day";
  }
};

const targetForDate = (goal,dateKey) => {
  let val = goal.targetHistory[0].value;
  for (const t of goal.targetHistory) if (t.date<=dateKey) val=t.value;
  return val;
};
const statusFor = (goal,value,target) => {
  if (value===undefined||value===null||value==="") return "empty";
  const v = Number(value);
  const buf = (goal.bufferPct??defaultBuffer(goal.type))/100;
  if (goal.type==="max") { if(v<=target) return "full"; if(v<=target*(1+buf)) return "partial"; return "missed"; }
  if (v>=target) return "full"; if (v>=target*(1-buf)) return "partial"; return "missed";
};
const SC = {full:"#6B8F71",partial:"#E8A33D",missed:"#C15B3C",empty:"#D8CFBC"};

const weeklyDone = (goal,dailyLogs,key) => weekDays(key).filter(d=>{
  const v=dailyLogs[d]?.values[goal.id];
  if (v===undefined||v==="") return false;
  return statusFor(goal,v,targetForDate(goal,d))==="full";
}).length;

const weeklyStreak = (goal,dailyLogs,today) => {
  let count=0, wk=weekStartKey(today); const curWk=wk, need=goal.weeklyCount||1; let guard=0;
  while(guard++<520){
    const hasData = weekDays(wk).some(d=>dailyLogs[d]);
    const met = weeklyDone(goal,dailyLogs,wk) >= need;
    if (met) count++;
    else if (wk!==curWk) break;   // a completed past week that missed → stop
    if (!hasData && wk!==curWk) break;
    wk = addDays(wk,-7);
  }
  return count;
};

const goalStreak = (goal,dailyLogs,today) => {
  if (isWeekly(goal)) return weeklyStreak(goal,dailyLogs,today);
  const keys = Object.keys(dailyLogs).sort();
  const earliest = keys[0] || today;
  let cur=today, count=0, guard=0;
  while (cur>=earliest && guard++<2000){
    if (cur<gstart(goal)) break;
    if (isActiveDay(goal,cur)){
      const s=statusFor(goal,dailyLogs[cur]?.values[goal.id],targetForDate(goal,cur));
      if (s==="full") count++;
      else if (cur===today && s==="empty"){ /* tolerate today not logged yet */ }
      else break;
    }
    cur=addDays(cur,-1);
  }
  return count;
};

const goalBestStreak = (goal,dailyLogs) => {
  const ks=Object.keys(dailyLogs).sort(); if(!ks.length) return 0;
  let best=0,run=0,cur=ks[0]; const end=ks[ks.length-1]; let guard=0;
  while(cur<=end && guard++<6000){
    if(cur>=gstart(goal) && isActiveDay(goal,cur)){
      const st=statusFor(goal,dailyLogs[cur]?.values[goal.id],targetForDate(goal,cur));
      if(st==="full"){run++; if(run>best)best=run;} else run=0;
    }
    cur=addDays(cur,1);
  }
  return best;
};
const goalHitRateAllTime = (goal,dailyLogs) => {
  const days = Object.keys(dailyLogs).filter(d=>isActiveDay(goal,d) && d>=gstart(goal) && dailyLogs[d].values[goal.id]!==undefined && dailyLogs[d].values[goal.id]!=="");
  if (!days.length) return 0;
  return Math.round(days.filter(d=>statusFor(goal,dailyLogs[d].values[goal.id],targetForDate(goal,d))==="full").length/days.length*100);
};
function autoStep(t){ t=Math.abs(Number(t)||0); if(t===0)return 1; if(t<2)return 0.1; if(t<=20)return 1; if(t<=200)return 5; if(t<=2000)return 50; return 100; }
const gstart = (g)=> g.startDate || (g.targetHistory[0]&&g.targetHistory[0].date) || "0000-00-00";
const firstEntryDate = (goal,dailyLogs) => {
  const ks=Object.keys(dailyLogs).sort();
  for(const d of ks){ const v=dailyLogs[d].values[goal.id]; if(v!==undefined&&v!=="") return d; }
  return null;
};
const goalHitRate7 = (goal,dailyLogs,today) => {
  const first=firstEntryDate(goal,dailyLogs);
  const days = Array.from({length:7},(_,i)=>addDays(today,-i)).filter(d=>isActiveDay(goal,d) && d>=gstart(goal) && (!first||d>=first));
  if (!days.length) return 0;
  return Math.round(days.filter(d=>statusFor(goal,dailyLogs[d]?.values[goal.id],targetForDate(goal,d))==="full").length/days.length*100);
};
const dailyScoresFor = (goals,dailyLogs,dates) => dates.map(d=>{
  const active = goals.filter(g=>!isWeekly(g) && !isSub(g) && isActiveDay(g,d) && d>=gstart(g));
  const log=dailyLogs[d];
  if (!log) return {date:d,full:0,partial:0,missed:0,total:active.length,hasData:false};
  let full=0,partial=0,missed=0;
  active.forEach(g=>{const s=statusFor(g,log.values[g.id],targetForDate(g,d));if(s==="full")full++;else if(s==="partial")partial++;else if(s==="missed")missed++;});
  return {date:d,full,partial,missed,total:active.length,hasData:true};
});

function reorderCategory(goals, category, newIds){
  const inCat = newIds.map(id=>goals.find(g=>g.id===id)).filter(Boolean);
  let k=0;
  return goals.map(g=> g.category===category ? (inCat[k++]||g) : g);
}
function confettiBurst(){
  try{
    const N=26, colors=["#C15B3C","#6B8F71","#E8A33D","#4F7CAC","#1B2A4A"];
    for(let i=0;i<N;i++){
      const el=document.createElement("div");
      el.style.cssText=`position:fixed;top:38%;left:50%;width:9px;height:14px;z-index:9999;pointer-events:none;border-radius:2px;background:${colors[i%colors.length]};opacity:1;`;
      document.body.appendChild(el);
      const ang=(Math.random()*2-1)*1.2 - Math.PI/2, dist=140+Math.random()*180;
      const dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist;
      const rot=(Math.random()*720-360);
      el.animate([{transform:"translate(-50%,-50%) rotate(0)",opacity:1},
        {transform:`translate(calc(-50% + ${dx}px), calc(-50% + ${dy+260}px)) rotate(${rot}deg)`,opacity:0}],
        {duration:1100+Math.random()*500,easing:"cubic-bezier(.2,.7,.3,1)"}).onfinish=()=>el.remove();
    }
  }catch(_){}
}

/* ══ COVER SCREEN — Galaxy Z Flip 6 outer display (≈360×374 CSS px) ══
   One-thumb logging. Tap a tile to add one step, hold it for the keypad.
   Auto-engages on a small viewport; unfold the phone and it hands back
   to the full app on the next resize event. Force with ?cover=1 / ?cover=0. */

const COVER_MAX_W = 470, COVER_MAX_H = 470;

function readCoverFlag(){
  try{
    const q = new URLSearchParams(location.search).get("cover");
    if(q==="1") return true;
    if(q==="0") return false;
  }catch(_){}
  return window.innerWidth<=COVER_MAX_W && window.innerHeight<=COVER_MAX_H;
}

function useCoverScreen(){
  const [on,setOn] = useState(readCoverFlag);
  useEffect(()=>{
    const sync = ()=>setOn(readCoverFlag());
    window.addEventListener("resize",sync);
    window.addEventListener("orientationchange",sync);
    return ()=>{ window.removeEventListener("resize",sync); window.removeEventListener("orientationchange",sync); };
  },[]);
  return on;
}

/* 6518 → 6.5k, 10000 → 10k, 1.5 → 1.5 */
const cvNum = (v) => {
  if(v===undefined||v===null||v==="") return "0";
  const n = Number(v); if(!isFinite(n)) return "0";
  if(Math.abs(n)>=10000) return (Math.round(n/100)/10).toFixed(n%1000===0?0:1).replace(/\.0$/,"")+"k";
  if(Math.abs(n)>=1000)  return (Math.round(n/100)/10).toFixed(1).replace(/\.0$/,"")+"k";
  return String(Math.round(n*100)/100);
};

function CoverTile({g,value,target,masked,onBump,onOpen}){
  const Icon = GoalIcon(g);
  const status = statusFor(g,value,target);
  const frac = progressFrac(g,value,target);
  const timer = useRef(null), held = useRef(false);
  const start = () => { held.current=false; timer.current=setTimeout(()=>{ held.current=true; buzz(20); onOpen(); },430); };
  const end = () => { clearTimeout(timer.current); if(!held.current) onBump(); };
  const kill = () => { clearTimeout(timer.current); held.current=true; };
  return (
    <button style={{...CVS.tile,borderColor:status==="empty"?"#EADFCB":SC[status]}}
      onPointerDown={start} onPointerUp={end} onPointerLeave={kill} onPointerCancel={kill}
      onContextMenu={e=>e.preventDefault()}>
      <div style={CVS.tileTop}>
        <Icon size={12} color="#1B2A4A" style={{opacity:0.65,flexShrink:0}}/>
        <span style={CVS.tileLabel}>{g.label}</span>
        {g.private && <Lock size={9} color="#A8978A" style={{flexShrink:0}}/>}
      </div>
      <div style={{display:"flex",alignItems:"baseline",minWidth:0}}>
        <span style={{...CVS.tileVal,color:status==="empty"?"#A8978A":SC[status]}}>
          {masked ? "••" : cvNum(value)}
        </span>
        {!masked && <span style={CVS.tileTgt}>/{cvNum(target)} {g.unit}</span>}
      </div>
      <div style={CVS.track}>
        <div style={{height:"100%",width:`${Math.round(frac*100)}%`,
          background:status==="empty"?"#D8CFBC":SC[status],transition:"width .2s ease"}}/>
      </div>
    </button>
  );
}

function CoverPad({g,target,value,onSave,onClose}){
  const [buf,setBuf] = useState(value===undefined||value===null||value===""?"":String(value));
  const stp = g.step || autoStep(target);
  const press = (k) => {
    buzz(8);
    if(k==="⌫") return setBuf(b=>b.slice(0,-1));
    if(k==="."&&buf.includes(".")) return;
    setBuf(b=>(b+k).slice(0,9));
  };
  const nudge = (d) => { const n=Math.max(0,Math.round(((Number(buf)||0)+d*stp)*100)/100); buzz(12); setBuf(String(n)); };
  return (
    <div style={CVS.pad}>
      <div style={CVS.padHead}>
        <span style={{fontFamily:"'Source Serif 4',Georgia,serif",fontSize:16,fontWeight:600}}>{g.label}</span>
        <span style={{fontSize:10.5,color:"#A8978A"}}>
          {g.type==="max"?"max":"at least"} {cvNum(target)} {g.unit}
        </span>
      </div>
      <div style={CVS.padVal}>
        <button style={CVS.step} onClick={()=>nudge(-1)}><Minus size={15} color="#1B2A4A"/></button>
        <span style={CVS.padNum}>{buf===""?<span style={{color:"#C9BDA8"}}>0</span>:buf}</span>
        <button style={CVS.step} onClick={()=>nudge(1)}><Plus size={15} color="#1B2A4A"/></button>
      </div>
      <div style={CVS.keys}>
        {["1","2","3","4","5","6","7","8","9",".","0","⌫"].map(k=>
          <button key={k} style={CVS.key} onClick={()=>press(k)}>{k}</button>)}
      </div>
      <div style={CVS.padFoot}>
        <button style={CVS.padBtn} onClick={onClose}>Cancel</button>
        <button style={CVS.padSave} onClick={()=>onSave(buf==="" ? "" : Number(buf))}>Save</button>
      </div>
    </div>
  );
}

function CoverView({goals,dayLog,today,streak,locked,privacyOn,onSet,onMood,mood,onFinish,onFull}){
  const [pad,setPad] = useState(null);
  const [toast,setToast] = useState(null);   // {label,goalId,prev,text}
  const [armed,setArmed] = useState(false);  // finish-day confirm
  const tRef = useRef(null), aRef = useRef(null);

  useEffect(()=>()=>{ clearTimeout(tRef.current); clearTimeout(aRef.current); },[]);

  const shown = useMemo(()=>goals.filter(g=>
    !isSub(g) && !isWeekly(g) && isActiveDay(g,today) && today>=gstart(g)
  ),[goals,today]);

  const hit = shown.filter(g=>statusFor(g,dayLog.values[g.id],targetForDate(g,today))==="full").length;

  const flash = (msg,goalId,prev) => {
    clearTimeout(tRef.current);
    setToast({text:msg,goalId,prev});
    tRef.current = setTimeout(()=>setToast(null),3200);
  };

  const bump = (g) => {
    if(locked) return;
    const target = targetForDate(g,today);
    const stp = g.step || autoStep(target);
    const prev = dayLog.values[g.id];
    const next = Math.round((Number(prev||0)+stp)*100)/100;
    buzz(14); onSet(g.id,next);
    flash(`${g.label} ${cvNum(next)} ${g.unit}`,g.id,prev);
  };

  const finish = () => {
    if(armed){ clearTimeout(aRef.current); setArmed(false); onFinish(); return; }
    setArmed(true); buzz(12);
    aRef.current = setTimeout(()=>setArmed(false),3000);
  };

  return (
    <div style={CVS.wrap}>
      <div style={CVS.head}>
        <span style={CVS.date}>{keyToDate(today).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})}</span>
        <div style={CVS.headRight}>
          {streak>0 && <span style={CVS.chip}><Flame size={13} color="#C15B3C"/>{streak}</span>}
          <span style={{...CVS.chip,color:hit===shown.length&&shown.length?"#6B8F71":"#A8978A"}}>
            {hit}/{shown.length}
          </span>
          <button onClick={onFull} style={{border:"none",background:"transparent",padding:2,lineHeight:0}}
            aria-label="Open the full app"><ChevronRight size={15} color="#A8978A"/></button>
        </div>
      </div>

      {shown.length===0 ? (
        <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",
          textAlign:"center",fontSize:12,color:"#A8978A",padding:"0 20px"}}>
          Nothing scheduled today. Open the full app to add a goal.
        </div>
      ) : (
        <div style={CVS.grid}>
          {shown.map(g=>
            <CoverTile key={g.id} g={g}
              value={dayLog.values[g.id]}
              target={targetForDate(g,today)}
              masked={privacyOn && g.private}
              onBump={()=>bump(g)}
              onOpen={()=>{ if(!locked) setPad(g); }}/>
          )}
        </div>
      )}

      <div style={CVS.foot}>
        {MOODS.map((m,i)=>
          <button key={i} style={{...CVS.mood,
            background: mood===i+1 ? "#1B2A4A" : "transparent",
            opacity: mood && mood!==i+1 ? 0.4 : 1}}
            onClick={()=>{ buzz(12); onMood(i+1); }}>{m}</button>
        )}
        {locked
          ? <span style={{...CVS.finish,background:"#F1EADA",color:"#6B6354",borderColor:"#EADFCB"}}>
              <Lock size={12} color="#6B6354"/> Done
            </span>
          : <button style={{...CVS.finish,...(armed?{background:"#6B8F71",borderColor:"#6B8F71"}:{})}}
              onClick={finish}>{armed ? "Sure?" : "Finish"}</button>}
      </div>

      {toast && !pad &&
        <div style={CVS.toast}>
          <span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{toast.text}</span>
          <button style={CVS.undo} onClick={()=>{
            onSet(toast.goalId, toast.prev===undefined?"":toast.prev);
            setToast(null); buzz(10);
          }}>Undo</button>
        </div>}

      {pad &&
        <CoverPad g={pad} target={targetForDate(pad,today)} value={dayLog.values[pad.id]}
          onClose={()=>setPad(null)}
          onSave={v=>{ onSet(pad.id,v); setPad(null); buzz(14); }}/>}
    </div>
  );
}

  const [deleteGoal,setDeleteGoal] = useState(null);
  const [historyGoal,setHistoryGoal] = useState(null);
  const [showUpdateTargets,setShowUpdateTargets] = useState(false);
  const [showAddTarget,setShowAddTarget] = useState(false);
  const [checkinTarget,setCheckinTarget] = useState(null);
  const [showCalendar,setShowCalendar] = useState(false);
  const [showSettings,setShowSettings] = useState(false);
  const [showFeedback,setShowFeedback] = useState(false);
  const [finalizeFor,setFinalizeFor] = useState(null);

  const coverMode = autoCover && !coverOff;
  useEffect(()=>{ if(autoCover) setCoverOff(false); },[autoCover]);

  const TODAY = todayKey();
  const isToday = selectedDate===TODAY;
  const dayLog = dailyLogs[selectedDate]||{values:{},finalized:false};
  const locked = !!dayLog.finalized;

  useEffect(()=>{
    saveState({goals,deletedGoals,deletedTargets,dailyLogs,notes,moods,bodyTargets,collapsed,darkMode,privacyOn,prefs,compact,savedCharts,macrosSeeded:true,chartsMigrated:true,sugarSplit:true});
    setLastSaved(Date.now());
  },[goals,deletedGoals,deletedTargets,dailyLogs,notes,moods,bodyTargets,collapsed,darkMode,privacyOn,prefs,compact,savedCharts]);

  const setValueOn = (dateKey,goalId,value) => setDailyLogs(l=>({...l,[dateKey]:{finalized:l[dateKey]?.finalized||false,values:{...(l[dateKey]?.values||{}),[goalId]:value}}}));
  const setValue = (goalId,value) => { if(locked) return; setValueOn(selectedDate,goalId,value); };
  const setNote = (v) => { if(locked) return; setNotes(n=>({...n,[selectedDate]:v})); };

  /* streak: count finalised days back from today (or yesterday if today unfinalised) */
  const streak = useMemo(()=>{
    let cur = dailyLogs[TODAY]?.finalized ? TODAY : addDays(TODAY,-1);
    let c=0; while(dailyLogs[cur]?.finalized){c++;cur=addDays(cur,-1);} return c;
  },[dailyLogs,TODAY]);
  const bestStreak = useMemo(()=>{
    const dates=Object.keys(dailyLogs).filter(d=>dailyLogs[d].finalized).sort();
    if(!dates.length) return 0;
    let best=1,run=1;
    for(let i=1;i<dates.length;i++){ if(dates[i]===addDays(dates[i-1],1)){run++; if(run>best)best=run;} else run=1; }
    return best;
  },[dailyLogs]);

  /* personal bests — exclude today unless finalised */
  const personalBests = useMemo(()=>{
    const bests={};
    goals.forEach(g=>{
      const entries=Object.keys(dailyLogs)
        .filter(d=> d!==TODAY || dailyLogs[d].finalized)
        .map(d=>({date:d,val:dailyLogs[d].values[g.id]}))
        .filter(e=>e.val!==undefined&&e.val!=="")
        .map(e=>({date:e.date,val:Number(e.val)}));
      if (!entries.length) return;
      bests[g.id]=g.type==="max"?entries.reduce((b,e)=>e.val<b.val?e:b):entries.reduce((b,e)=>e.val>b.val?e:b);
    }); return bests;
  },[goals,dailyLogs,TODAY]);
  const isNewPB = (goal,value) => {
    if (value===undefined||value===null||value==="") return false;
    const v=Number(value), pb=personalBests[goal.id];
    if (!pb) return false;
    return goal.type==="max"?v<=pb.val:v>=pb.val;
  };

  const addGoal = (g) => {
    const sd=g.startDate||selectedDate;
    setGoals(gs=>[...gs, makeGoal(`custom-${Date.now()}`, g.label, g.unit||"units", g.type, g.icon||"custom",
      [{date:sd,value:Number(g.target)}], null,
      {cadence:g.cadence||"daily", days:g.days||[1,2,3,4,5], private:g.private, startDate:sd, parentId:g.parentId||null})]);
    setShowAddGoal(false);
  };
  const saveGoalEdit = (id,patch) => setGoals(gs=>gs.map(g=>{
    if(g.id!==id) return g;
    let th=g.targetHistory;
    if(patch.target!==undefined && Number(patch.target)!==targetForDate(g,selectedDate)){
      th=[...g.targetHistory.filter(t=>t.date!==selectedDate),{date:selectedDate,value:Number(patch.target)}].sort((a,b)=>a.date<b.date?-1:1);
    }
    return {...g,...patch,targetHistory:th,target:undefined};
  }));
  const confirmDeleteGoal = (goal) => { setGoals(g=>g.filter(x=>x.id!==goal.id)); setDeletedGoals(d=>[{goal,deletedAt:TODAY},...d]); setDeleteGoal(null); };
  const restoreGoal = (id) => setDeletedGoals(d=>{const e=d.find(x=>x.goal.id===id);if(e)setGoals(g=>[...g,e.goal]);return d.filter(x=>x.goal.id!==id);});
  const updateGoalBuffer = (id,pct) => setGoals(gs=>gs.map(g=>g.id===id?{...g,bufferPct:pct===""?undefined:Number(pct)}:g));

  const syncTarget = (t) => {
    const dedup={}; [...(t.history||[])].forEach(x=>{ if(x&&x.date) dedup[x.date]=Number(x.value); });
    const hist=Object.keys(dedup).sort().map(d=>({date:d,value:dedup[d]}));
    return {...t, history:hist, start:hist.length?hist[0].value:t.start, startDate:hist.length?hist[0].date:t.startDate, current:hist.length?hist[hist.length-1].value:t.current};
  };
  const logCheckin = (id,ci) => setBodyTargets(bt=>bt.map(t=>t.id===id?syncTarget({...t,history:[...(t.history||[]),{date:ci.date,value:Number(ci.value)}]}):t));
  const addBodyTarget = (t) => { const sd=t.startDate||TODAY; setBodyTargets(bt=>[...bt, syncTarget({id:`bt-${Date.now()}`,label:t.label,unit:t.unit,format:t.format||"decimal",target:Number(t.target),history:[{date:sd,value:Number(t.start)}]})]); };
  const removeBodyTarget = (id) => setBodyTargets(bt=>{const t=bt.find(x=>x.id===id); if(t) setDeletedTargets(d=>[{target:t,deletedAt:TODAY},...d]); return bt.filter(x=>x.id!==id);});
  const restoreTarget = (id) => setDeletedTargets(d=>{const e=d.find(x=>x.target.id===id);if(e)setBodyTargets(bt=>[...bt,e.target]);return d.filter(x=>x.target.id!==id);});

  const finalizeDate = (d,mood) => {
    if (mood!=null) setMoods(m=>({...m,[d]:mood}));
    setDailyLogs(l=>({...l,[d]:{...(l[d]||{values:{}}),finalized:true}}));
    const active = goals.filter(g=>!isWeekly(g) && isActiveDay(g,d) && d>=gstart(g));
    const allHit = active.length>0 && active.every(g=>statusFor(g,dailyLogs[d]?.values[g.id],targetForDate(g,d))==="full");
    const anyPB = goals.some(g=>isNewPB(g,dailyLogs[d]?.values[g.id]));
    if (allHit || anyPB){ confettiBurst(); buzz(35); }
  };
  const doFinalize = (mood) => {
    finalizeDate(finalizeFor,mood);

/* ── shared small helpers ── */
function saveBlob(blob, filename){
  try{
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download=filename; a.rel="noopener";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    return true;
  }catch(e){ return false; }
}
function openBlob(blob){
  try{
    const url=URL.createObjectURL(blob);
    const w=window.open(url,"_blank");
    setTimeout(()=>URL.revokeObjectURL(url),20000);
    return !!w;
  }catch(e){ return false; }
}
/* text -> file. Installed PWAs / iOS Safari silently ignore data: URIs on <a download>,
   so try the native share sheet first, then a blob download, then open in a tab. */
function downloadText(filename, text, mime){
  mime = mime || "text/plain";
  const blob = new Blob([text],{type:mime+";charset=utf-8"});
  try{
    const file=new File([blob],filename,{type:mime});
    if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:filename}).catch(err=>{
        if(err && err.name==="AbortError") return;
        if(!saveBlob(blob,filename)) openBlob(blob);
      });
      return;
    }
  }catch(_){}
  if(!saveBlob(blob,filename)){
    if(!openBlob(blob)) alert("Couldn't save the file on this device.");
  }
}
const catsInOrder = (goals) => { const seen=[]; goals.forEach(g=>{ if(!seen.includes(g.category)) seen.push(g.category); }); return seen; };

function ReorderList({ids,onReorder,renderItem}){
  const [dragId,setDragId]=useState(null);
  const contRef=useRef(null);
  const start=(id,e)=>{ setDragId(id); try{e.currentTarget.setPointerCapture(e.pointerId);}catch(_){} };
  const move=(id,e)=>{
    if(dragId==null) return;
    const cont=contRef.current; if(!cont) return;
    const rows=Array.from(cont.querySelectorAll("[data-rid]"));
    const y=e.clientY; let target=null;
    for(const r of rows){ const b=r.getBoundingClientRect(); if(y<b.top+b.height/2){ target=r.getAttribute("data-rid"); break; } }
    const cur=ids.slice(); const from=cur.indexOf(dragId); if(from<0) return;
    cur.splice(from,1);
    let to = target==null ? cur.length : cur.indexOf(target); if(to<0) to=cur.length;
    cur.splice(to,0,dragId);
    if(cur.join("|")!==ids.join("|")) onReorder(cur);
  };
  const end=()=>setDragId(null);
  return <div ref={contRef} style={{display:"flex",flexDirection:"column",gap:10}}>
    {ids.map(id=>renderItem(id,{
      onPointerDown:(e)=>start(id,e), onPointerMove:(e)=>move(id,e),
      onPointerUp:end, onPointerCancel:end, style:{touchAction:"none",cursor:dragId?"grabbing":"grab"}
    },dragId===id))}
  </div>;
}

function progressFrac(goal,value,target){
  if(value===undefined||value===null||value==="") return goal.type==="max"?1:0;
  const v=Number(value); if(!(target>0)) return v>0?1:0;
  if(goal.type==="min") return Math.max(0,Math.min(1,v/target));
  return Math.max(0,Math.min(1,(target-v)/target));
}

          <input inputMode="decimal" pattern="[0-9]*[.,]?[0-9]*" style={{...S.numInput,borderColor:SC[status],background:locked?"#F1EADA":"#FAF6EE"}} value={value??""} placeholder="0" disabled={locked} onFocus={e=>e.target.select()} onChange={e=>onSet(g.id,e.target.value)}/>

}

/* ── insights (feature 7) ── */
function computeInsights(goals,dailyLogs,moods,today){
  const out=[]; const daily=goals.filter(g=>!isWeekly(g)&&!isSub(g));
  const rated=daily.map(g=>({g,rate:goalHitRateAllTime(g,dailyLogs)})).filter(x=>Object.keys(dailyLogs).some(d=>dailyLogs[d].values[x.g.id]!==undefined));
  if(rated.length){
    const best=[...rated].sort((a,b)=>b.rate-a.rate)[0];
    const worst=[...rated].sort((a,b)=>a.rate-b.rate)[0];
    if(best) out.push(`Your most consistent goal is ${best.g.label} at ${best.rate}% all-time.`);
    if(worst && worst.g.id!==best.g.id) out.push(`${worst.g.label} is your toughest right now (${worst.rate}%). One good day moves it.`);
  }
  // best current per-goal streak
  const streaks=daily.map(g=>({g,s:goalStreak(g,dailyLogs,today)})).sort((a,b)=>b.s-a.s)[0];
  if(streaks && streaks.s>=2) out.push(`You're on a ${streaks.s}-day streak for ${streaks.g.label}. Keep it alive.`);
  // mood correlation
  const moodKeys=Object.keys(moods);
  if(moodKeys.length>=5){
    let bestDelta=null;
    daily.forEach(g=>{
      const hit=[],miss=[];
      moodKeys.forEach(d=>{
        const v=dailyLogs[d]?.values[g.id]; if(v===undefined||v==="") return;
        const s=statusFor(g,v,targetForDate(g,d));
        (s==="full"?hit:miss).push(moods[d]);
      });
      if(hit.length>=3 && miss.length>=3){
        const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
        const delta=avg(hit)-avg(miss);
        if(bestDelta===null || delta>bestDelta.delta) bestDelta={g,delta};
      }
    });
    if(bestDelta && bestDelta.delta>0.4) out.push(`Your mood tends to be higher on days you hit ${bestDelta.g.label}.`);
  }
  return out.slice(0,3);
}

function HeatmapCalendar({goals,dailyLogs,today}) {
  const NW=13,total=NW*7;
  const days=Array.from({length:total},(_,i)=>addDays(today,-(total-1-i)));
  const daily=goals.filter(g=>!isWeekly(g)&&!isSub(g));
  const score=(d)=>{ let f=0,c=0; daily.forEach(g=>{ if(!isActiveDay(g,d)||d<gstart(g))return; const v=dailyLogs[d]?.values[g.id]; if(v===undefined||v==="")return; c++; if(statusFor(g,v,targetForDate(g,d))==="full")f++; }); return c?f/c:null; };
  const col=(sc)=>{ if(sc===null)return"#EFE7D6"; if(sc>=0.85)return"#6B8F71"; if(sc>=0.6)return"#A8C4AC"; if(sc>=0.35)return"#E8A33D"; if(sc>0)return"#D4896B"; return"#EADFCB"; };
  const weeks=Array.from({length:NW},(_,i)=>days.slice(i*7,(i+1)*7));
  const C=14,G=3,rowW=NW*(C+G);
  const monthMarks=[]; let lm=-1;
  weeks.forEach((w,wi)=>{ const dt=keyToDate(w[0]),m=dt.getMonth(); if(m!==lm){monthMarks.push({wi,label:dt.toLocaleDateString("en-GB",{month:"short"})}); lm=m;} });
  return (
    <div style={{overflowX:"auto"}}>
      <div style={{position:"relative",height:16,minWidth:rowW,marginBottom:2}}>
        {monthMarks.map((ml,i)=><span key={i} style={{position:"absolute",left:ml.wi*(C+G),fontSize:9,color:"#A8978A"}}>{ml.label}</span>)}
      </div>
      <div style={{display:"flex",gap:G,minWidth:rowW}}>
        {weeks.map((week,wi)=>(
          <div key={wi} style={{display:"flex",flexDirection:"column",gap:G}}>
            {week.map((d,di)=>{const sc=score(d),fut=d>today;return <div key={di} title={!fut?`${fmtShort(d)}: ${sc!==null?Math.round(sc*100)+"%":"no data"}`:""} style={{width:C,height:C,borderRadius:3,background:fut?"transparent":col(sc)}}/>;})}
          </div>
        ))}
      </div>
      <div style={{display:"flex",gap:10,marginTop:8,flexWrap:"wrap"}}>
        {[["#EADFCB","0%"],["#D4896B","<35%"],["#E8A33D","35-60%"],["#A8C4AC","60-85%"],["#6B8F71","85%+"]].map(([c,l],i)=>(
          <div key={i} style={{display:"flex",alignItems:"center",gap:3}}><div style={{width:10,height:10,borderRadius:2,background:c}}/><span style={{fontSize:9,color:"#A8978A"}}>{l}</span></div>
        ))}
      </div>
    </div>
  );
}

function fmtMeasure(v,unit,format){
  v=Number(v)||0;
  if(format==="stlb"){ let st=Math.floor(v); let lb=Math.round((v-st)*14); if(lb===14){st++;lb=0;} return `${st}st ${lb}lb`; }
  if(format==="ftin"){ let ft=Math.floor(v); let inch=Math.round((v-ft)*12); if(inch===12){ft++;inch=0;} return `${ft}′${inch}″`; }
  return `${Math.round(v*10)/10}${unit||""}`;
}
function Measure({format,value,onChange}){
  const v=Number(value)||0;
  if(format==="stlb"){ const st=Math.floor(v),lb=Math.round((v-st)*14);
    return <div style={{display:"flex",gap:6}}>
      <div style={{flex:1}}><input inputMode="numeric" style={{...S.input,marginBottom:0}} value={st} onChange={e=>onChange((Number(e.target.value)||0)+lb/14)} placeholder="st"/><span style={S.measUnit}>st</span></div>
      <div style={{flex:1}}><input inputMode="numeric" style={{...S.input,marginBottom:0}} value={lb} onChange={e=>onChange(st+(Number(e.target.value)||0)/14)} placeholder="lb"/><span style={S.measUnit}>lb</span></div>
    </div>;
  }
  if(format==="ftin"){ const ft=Math.floor(v),inch=Math.round((v-ft)*12);
    return <div style={{display:"flex",gap:6}}>
      <div style={{flex:1}}><input inputMode="numeric" style={{...S.input,marginBottom:0}} value={ft} onChange={e=>onChange((Number(e.target.value)||0)+inch/12)} placeholder="ft"/><span style={S.measUnit}>ft</span></div>
      <div style={{flex:1}}><input inputMode="numeric" style={{...S.input,marginBottom:0}} value={inch} onChange={e=>onChange(ft+(Number(e.target.value)||0)/12)} placeholder="in"/><span style={S.measUnit}>in</span></div>
    </div>;
  }
  return <input inputMode="decimal" style={{...S.input,marginBottom:0}} value={value} onChange={e=>onChange(e.target.value)}/>;
}

function SvgLineChart({history,targetVal,unit,format}) {
  if (!history||!history.length) return <p style={S.emptyLine}>No check-ins yet.</p>;
  const W=300,H=118,PX=30,TOP=26,BOT=26;
  const vals=history.map(h=>Number(h.value));
  const lo=Math.min(...vals,targetVal)*0.985;
  const hi=Math.max(...vals,targetVal)*1.015;
  const range=hi-lo||1;
  const xi=(i)=>PX+(i/Math.max(history.length-1,1))*(W-PX*2);
  const yi=(v)=>TOP+(1-(v-lo)/range)*(H-TOP-BOT);
  const pathD=history.map((h,i)=>`${i===0?"M":"L"}${xi(i).toFixed(1)},${yi(h.value).toFixed(1)}`).join(" ");
  const tY=yi(targetVal);
  let bestIdx=0; history.forEach((h,i)=>{ if(Math.abs(Number(h.value)-targetVal)<Math.abs(Number(history[bestIdx].value)-targetVal)) bestIdx=i; });
  const labelIdx=new Set([0,history.length-1,bestIdx]);
  return (
    <div style={{width:"100%",overflow:"visible",marginTop:6}}>
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",overflow:"visible",display:"block"}}>
        <defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#C15B3C" stopOpacity={0.15}/><stop offset="100%" stopColor="#C15B3C" stopOpacity={0}/></linearGradient></defs>
        <path d={`${pathD} L${xi(history.length-1).toFixed(1)},${H-BOT} L${xi(0).toFixed(1)},${H-BOT} Z`} fill="url(#lg)"/>
        <line x1={PX} y1={tY} x2={W-PX} y2={tY} stroke="#6B8F71" strokeDasharray="4 3" strokeWidth={1.5} opacity={0.8}/>
        <text x={W-PX} y={tY-5} textAnchor="end" fontSize={9} fill="#6B8F71">target {fmtMeasure(targetVal,unit,format)}</text>
        <path d={pathD} fill="none" stroke="#C15B3C" strokeWidth={2.5} strokeLinejoin="round" strokeLinecap="round"/>
        {history.map((h,i)=>(
          <g key={i}>
            <circle cx={xi(i)} cy={yi(h.value)} r={labelIdx.has(i)?5:3.5} fill="#C15B3C" stroke="#FAF6EE" strokeWidth={2}/>
            {labelIdx.has(i)&&<text x={xi(i)} y={yi(h.value)-11} textAnchor="middle" fontSize={10} fill="#1B2A4A" fontWeight="600">{fmtMeasure(h.value,unit,format)}</text>}
            {(i===0||i===history.length-1)&&<text x={xi(i)} y={H-8} textAnchor="middle" fontSize={9} fill="#A8978A">{fmtShort(h.date)}</text>}
          </g>
        ))}
      </svg>
    </div>
  );
}

function GoalHistoryModal({goal,dailyLogs,today,personalBests,privacyOn,onEdit,onClose}) {
  const Icon=GoalIcon(goal);
  const pts=Object.keys(dailyLogs).sort().map(d=>({date:d,value:dailyLogs[d].values[goal.id],target:targetForDate(goal,d)})).filter(p=>p.value!==undefined&&p.value!=="");
  const last14=pts.slice(-14);
  const hitAll=goalHitRateAllTime(goal,dailyLogs);
  const hit7=goalHitRate7(goal,dailyLogs,today);
  const st=goalStreak(goal,dailyLogs,today);
  const bst=goalBestStreak(goal,dailyLogs);
  const avg=pts.length?(pts.reduce((s,p)=>s+Number(p.value),0)/pts.length).toFixed(1):"—";
  const pb=personalBests[goal.id];
  const vals=last14.map(p=>Number(p.value));
  const lo=(Math.min(...(vals.length?vals:[0]),...last14.map(p=>p.target)))*0.9||0;
  const hi=(Math.max(...(vals.length?vals:[1]),...last14.map(p=>p.target)))*1.1||1;
  const range=hi-lo||1;
  return (
    <Modal onClose={onClose}>
      <div style={S.histHeadRow}><Icon size={22} color="#1B2A4A"/><h2 style={{...S.modalTitle,margin:0,flex:1}}>{goal.label}</h2>{onEdit&&<button style={S.editBtn} onClick={()=>onEdit(goal)}><Pencil size={14} color="#1B2A4A"/> Edit</button>}</div>
      <p style={S.modalSub}>Current target {targetForDate(goal,today)} {goal.unit} · {cadenceLabel(goal)}{goal.private?" · private":""}</p>
      <div style={S.statRow}>
        <MiniStat label="Streak" value={st} icon={Flame}/>
        <MiniStat label="Best" value={bst} icon={Flame}/>
        <MiniStat label="7d" value={`${hit7}%`}/>
        <MiniStat label="All-time" value={`${hitAll}%`}/>
      </div>
      {pb&&<div style={{...S.card,display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <div><span style={S.cardTitle}>Personal best</span><p style={{...S.cardSub,margin:"2px 0 0"}}>{fmtShort(pb.date)}</p></div>
        <span style={{fontFamily:"'JetBrains Mono',monospace",fontWeight:700,fontSize:18}}>🏆 {pb.val} {goal.unit}</span>
      </div>}
      {last14.length>0?(
        <div style={S.card}>
          <span style={S.cardTitle}>Last {last14.length} entries · avg {avg} {goal.unit}</span>
          <div style={S.sparkRow}>
            {last14.map((p,i)=>{const ss=statusFor(goal,p.value,p.target);return(
              <div key={i} style={S.sparkCol}>
                <div style={{...S.sparkBar,height:`${((p.value-lo)/range)*70+6}px`,background:SC[ss]}}/>
                <span style={S.sparkValue}>{p.value}</span>
                <span style={S.sparkLabel}>{fmtShort(p.date)}</span>
              </div>
            );})}
          </div>
        </div>
      ):<p style={S.emptyLine}>No entries logged for this goal yet.</p>}
      {goal.targetHistory.length>1&&<div style={S.card}><span style={S.cardTitle}>Target changes</span>{goal.targetHistory.map((t,i)=><div key={i} style={S.targetHistRow}><span style={S.rowTarget}>{fmtShort(t.date)}</span><span style={S.rowLabel}>{t.value} {goal.unit}</span></div>)}</div>}
    </Modal>
  );
}

/* ── Calendar ── */
function CalendarModal({selectedDate,today,dailyLogs,onSelect,onClose}) {
  const sel=keyToDate(selectedDate);
  const [vy,setVy]=useState(sel.getFullYear());
  const [vm,setVm]=useState(sel.getMonth());
  const first=new Date(vy,vm,1),off=(first.getDay()+6)%7,dim=new Date(vy,vm+1,0).getDate();
  const cells=[...Array(off).fill(null),...Array.from({length:dim},(_,i)=>i+1)];
  const chg=(d)=>{let m=vm+d,y=vy;if(m<0){m=11;y--;}if(m>11){m=0;y++;}setVm(m);setVy(y);};
  return (
    <Modal onClose={onClose}>
      <h2 style={S.modalTitle}>Jump to a date</h2>
      <p style={S.modalSub}>Pick any past day to log or review.</p>
      <div style={S.calHeader}>
        <button style={S.dateArrow} onClick={()=>chg(-1)}><ChevronLeft size={18} color="#1B2A4A"/></button>
        <span style={S.calMonthLabel}>{monthLabel(vy,vm)}</span>
        <button style={S.dateArrow} onClick={()=>chg(1)}><ChevronRight size={18} color="#1B2A4A"/></button>
      </div>
      <div style={S.calGrid}>
        {["M","T","W","T","F","S","S"].map((d,i)=><span key={i} style={S.calDowLabel}>{d}</span>)}
        {cells.map((day,i)=>{
          if(!day) return <div key={i}/>;
          const key=`${vy}-${pad(vm+1)}-${pad(day)}`;
          const fut=key>today,isSel=key===selectedDate,isTod=key===today,ci=!!dailyLogs[key]?.finalized;
          return <button key={i} disabled={fut} onClick={()=>onSelect(key)} style={{...S.calDay,...(isSel?S.calDaySelected:{}),...(fut?S.calDayDisabled:{}),...(isTod&&!isSel?S.calDayToday:{})}}>{day}{ci&&!isSel&&<span style={S.calDot}/>}</button>;
        })}
      </div>
      <div style={S.calLegend}><span style={S.calDot}/> checked in</div>
    </Modal>
  );
}

/* ── Share image (native share + download) ── */
function ShareModal({date,goals,dailyLogs,moods,notes,streak,privacyOn,personalBests,onClose}) {
  const canvasRef=useRef(null);
  const log=dailyLogs[date]||{values:{}};
  const note=notes[date]||"";
  const mood=moods[date];
  const shown = goals.filter(g=> !isSub(g) && ((!isWeekly(g) && isActiveDay(g,date)) || (log.values[g.id]!==undefined && log.values[g.id]!=="")));
  useEffect(()=>{
    const canvas=canvasRef.current; if(!canvas)return;
    const W=640,goalH=70,noteH=note?52:0,H=220+shown.length*goalH+noteH+40;
    canvas.width=W; canvas.height=H;
    const ctx=canvas.getContext("2d");
    ctx.fillStyle="#FAF6EE"; ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#1B2A4A"; ctx.fillRect(0,0,8,H);
    ctx.fillStyle="#A8978A"; ctx.font="600 12px Inter,sans-serif"; ctx.fillText("DAILY LEDGER",44,48);
    ctx.fillStyle="#1B2A4A"; ctx.font="bold 32px Georgia,serif"; ctx.fillText("Accountable",44,88);
    ctx.fillStyle="#6B6354"; ctx.font="500 14px Inter,sans-serif"; ctx.fillText(fmtPretty(date),44,112);
    ctx.fillStyle="#FFF"; ctx.strokeStyle="#EADFCB"; ctx.lineWidth=1;
    rr(ctx,44,128,W-88,48,12); ctx.fill(); ctx.stroke();
    ctx.fillStyle="#C15B3C"; ctx.font="bold 17px Inter,sans-serif";
    ctx.fillText(`🔥 ${streak} day streak${mood?" · "+MOODS[mood-1]+" "+MOOD_WORDS[mood]:""}`,64,158);
    let y=196;
    shown.forEach(g=>{
      const target=targetForDate(g,date),value=log.values[g.id],status=statusFor(g,value,target);
      ctx.fillStyle="#FFF"; ctx.strokeStyle="#EADFCB"; ctx.lineWidth=1;
      rr(ctx,44,y,W-88,58,12); ctx.fill(); ctx.stroke();
      ctx.fillStyle=g.accent||SC[status]; rr(ctx,44,y,6,58,0); ctx.fill();
      ctx.fillStyle=SC[status]; ctx.beginPath(); ctx.arc(80,y+29,10,0,Math.PI*2); ctx.fill();
      if(status==="full"){ctx.strokeStyle="#FFF";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(74,y+29);ctx.lineTo(79,y+34);ctx.lineTo(87,y+23);ctx.stroke();}
      const masked = privacyOn && g.private;
      ctx.fillStyle="#1B2A4A"; ctx.font="600 15px Inter,sans-serif"; ctx.fillText(masked?"Private goal":g.label,102,y+24);
      ctx.fillStyle="#A8978A"; ctx.font="400 12px Inter,sans-serif";
      const sub = masked ? (status==="full"?"completed":status==="empty"?"—":"logged") : `${value??"—"} ${g.unit} · ${g.type==="max"?"max":"min"} ${target} ${g.unit}`;
      ctx.fillText(sub,102,y+42);
      if(!masked){
        const gst=goalStreak(g,dailyLogs,date);
        const pbv=personalBests&&personalBests[g.id];
        const isPB=pbv&&value!==undefined&&value!==""&&(g.type==="max"?Number(value)<=pbv.val:Number(value)>=pbv.val);
        let rx=W-64;
        ctx.textAlign="right";
        if(isPB){ ctx.font="18px sans-serif"; ctx.fillText("🏆",rx,y+37); rx-=30; }
        if(gst>0){ ctx.fillStyle="#C15B3C"; ctx.font="bold 14px Inter,sans-serif"; ctx.fillText(`🔥 ${gst}`,rx,y+36); }
        ctx.textAlign="left";
      }
      y+=goalH;
    });
    if(note){ctx.fillStyle="#6B6354";ctx.font="italic 13px Inter,sans-serif";ctx.fillText(`"${note.slice(0,76)}"`,44,y+22);}
    ctx.fillStyle="#A8978A"; ctx.font="italic 11px Inter,sans-serif"; ctx.fillText("Logged, not perfect — and that's the point.",44,H-12);
  },[date,goals,dailyLogs,streak,note,mood,privacyOn,personalBests]);

  const share=()=>{
    const c=canvasRef.current; if(!c) return;
    c.toBlob(async(blob)=>{
      if(!blob) return;
      const file=new File([blob],`accountable-${date}.png`,{type:"image/png"});
      try{
        if(navigator.canShare && navigator.canShare({files:[file]})){
          await navigator.share({files:[file],title:"Accountable",text:`My ${fmtShort(date)} — ${streak} day streak`});
          return;
        }
      }catch(e){ if(e&&e.name==="AbortError") return; }
      const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=`accountable-${date}.png`;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(url),1000);
    },"image/png");
  };
  const download=()=>{const c=canvasRef.current,url=c.toDataURL("image/png"),a=document.createElement("a");a.href=url;a.download=`accountable-${date}.png`;document.body.appendChild(a);a.click();document.body.removeChild(a);};
  return (
    <Modal onClose={onClose}>
      <h2 style={S.modalTitle}>Share summary</h2>
      <p style={S.modalSub}>A snapshot of {fmtPretty(date)}.</p>
      <div style={S.canvasWrap}><canvas ref={canvasRef} style={S.canvasImg}/></div>
      <button style={S.primaryBtn} onClick={share}><Share2 size={16}/> Share…</button>
      <button style={S.dashedBtn} onClick={download}><Download size={16}/> Save image instead</button>
    </Modal>
  );
}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

  const submit=()=>{
    const body=`[${kind}] Accountable feedback:\n\n${text}\n\n— sent ${new Date().toLocaleString()}`;
    window.location.href=`mailto:simon1990@gmail.com?subject=${encodeURIComponent("Accountable — "+kind)}&body=${encodeURIComponent(body)}`;
    onClose();
  };
  return (
    <Modal onClose={onClose}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}><Bug size={20} color="#C15B3C"/><h2 style={{...S.modalTitle,margin:0}}>Report / suggest</h2></div>
      <p style={S.modalSub}>Spotted a bug or want a feature? Jot it down and hit submit.</p>
      <div style={S.segment}>
        {["Bug","Feature","Other"].map(k=><button key={k} style={{...S.segmentBtn,...(kind===k?S.segmentBtnActive:{})}} onClick={()=>setKind(k)}>{k}</button>)}

}

function momentumScore(goals,dailyLogs,today,streak){
  const daily=goals.filter(g=>!isWeekly(g)&&!isSub(g));
  const days=Array.from({length:7},(_,i)=>addDays(today,-i));
  let hit=0,tot=0;
  days.forEach(d=>daily.forEach(g=>{ if(!isActiveDay(g,d))return; const v=dailyLogs[d]?.values[g.id]; if(v===undefined||v==="")return; tot++; if(statusFor(g,v,targetForDate(g,d))==="full")hit++; }));
  const recent=tot?hit/tot:0;
  const streakBoost=Math.min(streak/14,1);
  return Math.round((recent*0.6+streakBoost*0.4)*100);
}
function momentumWord(s){ return s>=90?"On fire":s>=75?"Strong":s>=55?"Building":s>=30?"Warming up":"Reset"; }
function projectTarget(t){
  const h=t.history||[]; if(h.length<2) return null;
  const first=h[0], last=h[h.length-1];
  const days=(keyToDate(last.date)-keyToDate(first.date))/86400000;
  if(days<=0) return null;
  const rate=(Number(last.value)-Number(first.value))/days;
  if(rate===0) return null;
  const remaining=Number(t.target)-Number(last.value);
  if((remaining<0)!==(rate<0)) return null;
  const daysLeft=remaining/rate;
  if(daysLeft<=0||daysLeft>3650) return null;
  return {eta:addDays(last.date,Math.round(daysLeft)),daysLeft:Math.round(daysLeft)};
}
function pickFocusGoal(goals,dailyLogs,today){
  const active=goals.filter(g=>!isWeekly(g)&&!isSub(g)&&isActiveDay(g,today));
  const rated=active.map(g=>({g,r:goalHitRate7(g,dailyLogs,today)}))
    .filter(x=>Object.keys(dailyLogs).some(d=>dailyLogs[d].values[x.g.id]!==undefined&&dailyLogs[d].values[x.g.id]!==""));
  if(!rated.length) return null;
  rated.sort((a,b)=>a.r-b.r);
  return rated[0].r<100 ? rated[0].g : null;
}
const MOOD_TINTS=["","#C15B3C","#D0863C","#E8A33D","#6B8F71","#4F7CAC"];

}

/* ── Weekly Wrapped ── */
function WrappedModal({goals,dailyLogs,moods,bodyTargets,notes,today,streak,privacyOn,onClose}){
  const canvasRef=useRef(null);
  const [start,setStart]=useState(weekStartKey(today));
  const [end,setEnd]=useState(addDays(weekStartKey(today),6));
  const lo = start<=end?start:end, hi = start<=end?end:start;
  const days = useMemo(()=>{ const out=[]; let d=lo,guard=0; while(d<=hi&&guard++<400){out.push(d);d=addDays(d,1);} return out; },[lo,hi]);

  const stats=useMemo(()=>{
    const daily=goals.filter(g=>!isWeekly(g));
    const scored=daily.filter(g=>!isSub(g));
    let hit=0,tot=0,finalised=0; const moodVals=[];
    const dayRatios=days.map(d=>{
      if(dailyLogs[d]&&dailyLogs[d].finalized) finalised++;
      if(moods[d]) moodVals.push(moods[d]);
      let f=0,pa=0,mi=0,c=0;
      scored.forEach(g=>{ if(!isActiveDay(g,d)||d<gstart(g))return; const v=dailyLogs[d]?.values[g.id]; if(v===undefined||v==="")return; c++; tot++; const st=statusFor(g,v,targetForDate(g,d)); if(st==="full"){f++;hit++;}else if(st==="partial")pa++;else if(st==="missed")mi++; });
      return {date:d,full:f,partial:pa,missed:mi,total:c};
    });
    const perGoal=daily.map(g=>{
      let sum=0,n=0,fh=0,ac=0;
      days.forEach(d=>{ if(!isActiveDay(g,d)||d<gstart(g))return; const v=dailyLogs[d]?.values[g.id]; if(v===undefined||v==="")return; ac++; sum+=Number(v); n++; if(statusFor(g,v,targetForDate(g,d))==="full")fh++; });
      return {g,avg:n?sum/n:null,n,rate:ac?Math.round(fh/ac*100):0};
    }).filter(x=>x.avg!==null);
    const avgMood=moodVals.length?Math.round(moodVals.reduce((a,b)=>a+b,0)/moodVals.length):null;
    const targetChanges=(bodyTargets||[]).map(t=>{ const before=[...t.history].filter(h=>h.date<lo).slice(-1)[0]; const within=[...t.history].filter(h=>h.date<=hi); const last=within.slice(-1)[0]; const baseV=before?before.value:(within[0]?within[0].value:null); if(baseV==null||!last) return {t,delta:null}; return {t,delta:Number(last.value)-Number(baseV)}; }).filter(x=>x.delta!==null);
    return {finalised,N:days.length,pct:tot?Math.round(hit/tot*100):0,perGoal,avgMood,dayRatios,targetChanges};
  },[goals,dailyLogs,moods,bodyTargets,days,lo,hi]);

  useEffect(()=>{
    const canvas=canvasRef.current; if(!canvas)return;
    const W=640, pad=44;
    const goalsH=stats.perGoal.length*46;
    const tgtH=stats.targetChanges.length?(28+stats.targetChanges.length*30):0;
    const H=328+goalsH+96+tgtH+56;
    const ctx=canvas.getContext("2d"); canvas.width=W; canvas.height=H;
    const bg=ctx.createLinearGradient(0,0,0,H); bg.addColorStop(0,"#1B2A4A"); bg.addColorStop(1,"#24406B");
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
    // header
    ctx.fillStyle="#E8A33D"; ctx.font="600 13px Inter,sans-serif"; ctx.fillText("WRAPPED",pad,56);
    ctx.fillStyle="#FAF6EE"; ctx.font="bold 38px Georgia,serif"; ctx.fillText("Your roundup",pad,102);
    ctx.fillStyle="#A9B6CE"; ctx.font="500 15px Inter,sans-serif"; ctx.fillText(`${fmtPretty(lo)}  —  ${fmtPretty(hi)}`,pad,130);
    // streak chip
    ctx.fillStyle="rgba(232,163,61,0.16)"; rr(ctx,W-pad-96,40,96,30,15); ctx.fill();
    ctx.fillStyle="#E8A33D"; ctx.font="700 13px Inter,sans-serif"; ctx.textAlign="center"; ctx.fillText(`🔥 ${streak} day`,W-pad-48,60); ctx.textAlign="left";
    // three stat cards
    const cw=(W-pad*2-24)/3;
    const stat=(x,label,big,sub)=>{ ctx.fillStyle="rgba(255,255,255,0.07)"; rr(ctx,x,158,cw,96,16); ctx.fill();
      ctx.fillStyle="#A9B6CE"; ctx.font="600 11px Inter,sans-serif"; ctx.fillText(label,x+16,186);
      ctx.fillStyle="#FAF6EE"; ctx.font="bold 30px Georgia,serif"; ctx.fillText(big,x+16,224);
      if(sub){ctx.fillStyle="#E8A33D";ctx.font="500 12px Inter,sans-serif";ctx.fillText(sub,x+16,244);} };
    stat(pad,"DAYS FINALISED",`${stats.finalised}/${stats.N}`,stats.finalised>=Math.ceil(stats.N*0.7)?"strong":"");
    stat(pad+cw+12,"GOALS HIT",`${stats.pct}%`,"of logged");
    stat(pad+cw*2+24,"AVG MOOD",stats.avgMood?MOODS[stats.avgMood-1]:"—",stats.avgMood?MOOD_WORDS[stats.avgMood]:"no data");
    // goal averages (centrepiece)
    let y=292;
    ctx.fillStyle="#A9B6CE"; ctx.font="600 12px Inter,sans-serif"; ctx.fillText("GOAL AVERAGES",pad,y); y+=18;
    if(!stats.perGoal.length){ ctx.fillStyle="#7E8CA8"; ctx.font="italic 13px Inter,sans-serif"; ctx.fillText("No goals logged in this range.",pad,y+14); y+=30; }
    stats.perGoal.forEach(({g,avg,n,rate})=>{
      const masked = privacyOn && g.private;
      ctx.fillStyle="#FAF6EE"; ctx.font="600 15px Inter,sans-serif"; ctx.fillText(masked?"Private goal":g.label,pad,y+14);
      ctx.fillStyle="#FAF6EE"; ctx.font="bold 16px 'Georgia',serif"; ctx.textAlign="right";
      ctx.fillText(masked?"—":`${Math.round(avg*10)/10} ${g.unit}`,W-pad,y+14); ctx.textAlign="left";
      // hit-rate bar
      const bw=W-pad*2;
      ctx.fillStyle="rgba(255,255,255,0.10)"; rr(ctx,pad,y+24,bw,6,3); ctx.fill();
      ctx.fillStyle=rate>=70?"#6B8F71":rate>=40?"#E8A33D":"#C15B3C"; rr(ctx,pad,y+24,bw*rate/100,6,3); ctx.fill();
      ctx.fillStyle="#7E8CA8"; ctx.font="500 10px Inter,sans-serif"; ctx.fillText(`hit ${rate}% · ${n} ${n===1?"day":"days"} logged`,pad,y+42);
      y+=46;
    });
    // day-by-day stacked bars
    y+=6;
    ctx.fillStyle="#A9B6CE"; ctx.font="600 12px Inter,sans-serif"; ctx.fillText("DAY BY DAY",pad,y); y+=14;
    const bx=pad, bw2=(W-pad*2)/stats.dayRatios.length, maxH=58, by=y;
    stats.dayRatios.forEach((d,i)=>{
      const x0=bx+i*bw2+2, w=Math.max(2,bw2-4);
      ctx.fillStyle="rgba(255,255,255,0.09)"; rr(ctx,x0,by,w,maxH,4); ctx.fill();
      if(d.total>0){ const fh=(d.full/d.total)*maxH,ph=(d.partial/d.total)*maxH,mh=(d.missed/d.total)*maxH; let yb=by+maxH;
        ctx.fillStyle="#6B8F71"; ctx.fillRect(x0,yb-fh,w,fh); yb-=fh;
        ctx.fillStyle="#E8A33D"; ctx.fillRect(x0,yb-ph,w,ph); yb-=ph;
        ctx.fillStyle="#C15B3C"; ctx.fillRect(x0,yb-mh,w,mh); }
      if(stats.dayRatios.length<=14){ ctx.fillStyle="#7E8CA8"; ctx.font="500 9px Inter,sans-serif"; ctx.textAlign="center"; ctx.fillText(fmtDow(d.date),x0+w/2,by+maxH+14); ctx.textAlign="left"; }
    });
    y=by+maxH+(stats.dayRatios.length<=14?26:12);
    // targets
    if(stats.targetChanges.length){

      stats.targetChanges.forEach(({t,delta})=>{
        ctx.fillStyle="rgba(255,255,255,0.05)"; rr(ctx,pad,y,W-pad*2,26,10); ctx.fill();

        const down=delta<0, txt=(delta===0?"no change":`${down?"▼":"▲"} ${fmtMeasure(Math.abs(delta),t.unit,t.format)}`);
        ctx.fillStyle=delta===0?"#7E8CA8":(down?"#7FB584":"#E39B7F"); ctx.font="700 13px Inter,sans-serif"; ctx.textAlign="right"; ctx.fillText(txt,W-pad-16,y+18); ctx.textAlign="left"; y+=30;
      });
    }
    ctx.fillStyle="#7E8CA8"; ctx.font="italic 12px Inter,sans-serif"; ctx.fillText("Accountable — logged, not perfect.",pad,H-18);

  const share=()=>{

  const setThisWeek=()=>{ setStart(weekStartKey(today)); setEnd(addDays(weekStartKey(today),6)); };

/* ── Data Hub ── */
function dhBucketKey(date,group){
  if(group==="week") return weekStartKey(date);
  if(group==="month") return date.slice(0,7);
  if(group==="weekday") return String(dow(date));
  return date;
}
function dhBucketLabel(key,group){
  if(group==="weekday") return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][Number(key)];
  if(group==="month") return keyToDate(key+"-01").toLocaleDateString("en-GB",{month:"short",year:"2-digit"});
  return fmtShort(key);
}
function dhWindowDays(sel){
  const n=Number(sel.range==="rel"?sel.days:sel.range);
  return Math.max(1,Math.min(3650,isNaN(n)?7:n));
}
function dhBounds(sel,today,firstDate){
  const end = sel.includeToday ? today : addDays(today,-1);
  if(sel.range==="custom") return {from:sel.from,to:sel.to};
  if(sel.range==="all") return {from:firstDate||end,to:end};
  if(sel.range==="since") return {from:sel.since||firstDate||end,to:end};
  return {from:addDays(end,-(dhWindowDays(sel)-1)),to:end};
}
function dhRangeLabel(sel){
  if(sel.range==="custom") return `${fmtShort(sel.from)} – ${fmtShort(sel.to)}`;
  const tail = sel.includeToday ? "to today" : "to yesterday";
  if(sel.range==="all") return `all time ${tail}`;
  if(sel.range==="since") return `since ${sel.since?fmtShort(sel.since):"start"} ${tail}`;
  return `past ${dhWindowDays(sel)} days ${tail}`;
}
function computeSeries(sel,ctx,goalId){
  const {goals,dailyLogs,moods,today}=ctx;
  const gid=goalId||sel.goalId;
  const isMood=gid==="__mood__";
  const goal=isMood?{id:"__mood__",type:"min",unit:"",label:"Mood"}:goals.find(g=>g.id===gid);
  if(!goal) return {points:[],unit:"",name:""};
  let dates=[...new Set(isMood?Object.keys(moods):Object.keys(dailyLogs))].sort();
  const b=dhBounds(sel,today,dates[0]);
  const from=b.from,to=b.to;
  dates=dates.filter(d=>d>=from&&d<=to);
  const buckets={};
  dates.forEach(d=>{
    let val,hit=null,has=false;
    if(isMood){ if(moods[d]!==undefined&&moods[d]!==null){val=Number(moods[d]);has=true;} }
    else { if(!isActiveDay(goal,d)||d<gstart(goal))return; const v=dailyLogs[d]?.values[goal.id]; if(v!==undefined&&v!==""){val=Number(v);has=true;hit=statusFor(goal,v,targetForDate(goal,d))==="full"?1:0;} }
    if(!has)return;
    const k=dhBucketKey(d,sel.group); (buckets[k]=buckets[k]||[]).push({val,hit});
  });
  let keys=Object.keys(buckets);
  if(sel.group==="weekday") keys.sort((a,b)=>((Number(a)+6)%7)-((Number(b)+6)%7)); else keys.sort();
  const points=keys.map(k=>{
    const arr=buckets[k]; let value;
    if(sel.metric==="hit"){ value=Math.round(arr.filter(x=>x.hit===1).length/arr.length*100); }
    else { const vs=arr.map(x=>x.val); value=sel.agg==="total"?vs.reduce((a,b)=>a+b,0):sel.agg==="min"?Math.min(...vs):sel.agg==="max"?Math.max(...vs):vs.reduce((a,b)=>a+b,0)/vs.length; value=Math.round(value*10)/10; }
    return {key:k,label:dhBucketLabel(k,sel.group),value};
  });
  return {points,unit:sel.metric==="hit"?"%":(goal.unit||""),name:goal.label||""};
}
function dhAvgOver(goal,dailyLogs,today,offset,len){ const vs=[]; for(let i=offset;i<offset+len;i++){ const d=addDays(today,-i); if(!isActiveDay(goal,d)||d<gstart(goal))continue; const v=dailyLogs[d]?.values[goal.id]; if(v!==undefined&&v!=="")vs.push(Number(v)); } return vs.length?vs.reduce((a,b)=>a+b,0)/vs.length:null; }
function summaryRow(goal,dailyLogs,today){
  const dated=Object.keys(dailyLogs).filter(d=>isActiveDay(goal,d)&&d>=gstart(goal)).map(d=>({d,v:dailyLogs[d]?.values[goal.id]})).filter(e=>e.v!==undefined&&e.v!=="").map(e=>({d:e.d,v:Number(e.v)})).sort((a,b)=>a.d<b.d?-1:1);
  if(!dated.length) return {avg:null};
  const entries=dated.map(e=>e.v);
  const avg=entries.reduce((a,b)=>a+b,0)/entries.length, lo=Math.min(...entries), hi=Math.max(...entries);
  const rec=dhAvgOver(goal,dailyLogs,today,0,7), prev=dhAvgOver(goal,dailyLogs,today,7,7);
  let trend=0; if(rec!=null&&prev!=null&&rec!==prev){ trend=(goal.type==="max"?rec<prev:rec>prev)?1:-1; }
  return {avg:Math.round(avg*10)/10, latest:dated[dated.length-1].v, n:dated.length,
    best:goal.type==="max"?lo:hi, worst:goal.type==="max"?hi:lo,
    cur:goalStreak(goal,dailyLogs,today), bst:goalBestStreak(goal,dailyLogs), rate:goalHitRateAllTime(goal,dailyLogs), trend};
}
function ChartView({series,type,trend,height=190}){
  const ok=(v)=>v!==undefined&&v!==null&&!isNaN(v);
  const all=series.flatMap(s=>s.points.map(p=>p.value)).filter(ok);
  if(!all.length||!series.length) return <p style={S.emptyLine}>No data for this selection.</p>;
  const labels=series[0].points.map(p=>p.label); const n=labels.length;
  const W=Math.max(300,n*(type==="bar"?40:34)); const H=height,PL=32,PB=26,PT=10,PR=10;
  let min=Math.min(...all,0),max=Math.max(...all); if(min===max)max=min+1;
  const x=(i)=>PL+(n<=1?(W-PL-PR)/2:(i/(n-1))*(W-PL-PR));
  const bwid=(W-PL-PR)/n, xb=(i)=>PL+(i+0.5)*bwid;
  const y=(v)=>PT+(1-(v-min)/(max-min))*(H-PT-PB);
  const p0=series[0].points.filter(p=>ok(p.value));
  let trendEl=null;
  if(trend&&trend!=="off"&&p0.length>=2){
    let a,b;
    if(trend==="avg"){ b=0; a=p0.reduce((x,p)=>x+p.value,0)/p0.length; }
    else { const m=p0.length; let sx=0,sy=0,sxy=0,sxx=0; p0.forEach((p,i)=>{sx+=i;sy+=p.value;sxy+=i*p.value;sxx+=i*i;}); b=(m*sxy-sx*sy)/((m*sxx-sx*sx)||1); a=(sy-b*sx)/m; }
    const xa=type==="bar"?xb(0):x(0), xz=type==="bar"?xb(p0.length-1):x(p0.length-1);
    trendEl=<line x1={xa} y1={y(a)} x2={xz} y2={y(a+b*(p0.length-1))} stroke="#1B2A4A" strokeWidth={2} strokeDasharray="5 4" opacity={0.7}/>;
  }
  return <div style={{overflowX:"auto"}}><svg viewBox={`0 0 ${W} ${H}`} style={{width:n>10?W:"100%",maxWidth:"100%",display:"block"}}>
    {[min,(min+max)/2,max].map((tv,i)=>(<g key={i}><line x1={PL} y1={y(tv)} x2={W-PR} y2={y(tv)} stroke="#EFE7D6"/><text x={2} y={y(tv)+3} fontSize={8.5} fill="#A8978A">{Math.round(tv*10)/10}</text></g>))}
    {series.map((sr,si)=>{
      if(type==="bar"&&si===0) return sr.points.map((p,i)=>ok(p.value)?<rect key={i} x={xb(i)-bwid*0.32} y={y(p.value)} width={bwid*0.64} height={Math.max(0,H-PB-y(p.value))} rx={3} fill={sr.color}/>:null);
      let d="",prev=false;
      sr.points.forEach((p,i)=>{ if(!ok(p.value)){prev=false;return;} d+=`${prev?"L":"M"}${(type==="bar"?xb(i):x(i)).toFixed(1)},${y(p.value).toFixed(1)} `; prev=true; });
      return <g key={si}><path d={d} fill="none" stroke={sr.color} strokeWidth={2} strokeLinejoin="round"/>{sr.points.map((p,i)=>ok(p.value)?<circle key={i} cx={type==="bar"?xb(i):x(i)} cy={y(p.value)} r={3} fill={sr.color} stroke="#FFF" strokeWidth={1}/>:null)}</g>;
    })}
    {trendEl}
    {labels.map((l,i)=>(n<=14||i%Math.ceil(n/14)===0)?<text key={i} x={type==="bar"?xb(i):x(i)} y={H-8} textAnchor="middle" fontSize={8.5} fill="#A8978A">{l}</text>:null)}
  </svg></div>;
}
const DH_COLORS=["#C15B3C","#4F7CAC","#6B8F71","#9B6A9E","#E8A33D","#1B2A4A","#C9A227"];
function dhSelIds(sel){
  if(Array.isArray(sel.goalIds)&&sel.goalIds.length) return sel.goalIds;
  const out=[]; if(sel.goalId) out.push(sel.goalId); if(sel.goalId2) out.push(sel.goalId2);
  return out;
}
function buildSeriesArr(sel,ctx){
  const ids=dhSelIds(sel);
  const raw=ids.map(id=>computeSeries(sel,ctx,id)).filter(r=>r.name!==undefined);
  const seen=[]; raw.forEach(r=>r.points.forEach(p=>{ if(!seen.includes(p.key)) seen.push(p.key); }));
  const keys=sel.group==="weekday" ? seen.slice().sort((a,b)=>((Number(a)+6)%7)-((Number(b)+6)%7)) : seen.slice().sort();
  const ser=raw.map((r,i)=>{
    const m=Object.fromEntries(r.points.map(p=>[p.key,p.value]));
    return {name:r.name,color:DH_COLORS[i%DH_COLORS.length],points:keys.map(k=>({label:dhBucketLabel(k,sel.group),value:m[k]}))};
  });
  return {ser,unit:raw[0]?raw[0].unit:""};
}
function DataHubTab({goals,dailyLogs,moods,today,savedCharts,setSavedCharts}){

    var e=document.getElementById("err"); if(e){ e.style.display="block"; e.textContent=String(msg); }
  }
  window.addEventListener("error", function(ev){ if(ev&&(ev.error||ev.message)) showErr((ev.error&&ev.error.stack)||ev.message); });
  window.addEventListener("unhandledrejection", function(ev){ showErr((ev.reason&&ev.reason.stack)||ev.reason); });
  function loadScript(name, urls){
    return new Promise(function(res,rej){
      var i=0;
      (function tryNext(){
        if(i>=urls.length){ rej(new Error(name+" failed to load from all sources")); return; }
        var url=urls[i++]; setStatus("loading "+name+"…");
        var s=document.createElement("script"); s.src=url; s.async=false;
        s.onload=function(){ res(); }; s.onerror=function(){ tryNext(); };
        document.head.appendChild(s);
      })();
    });
  }
  var REACT=["https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js","https://unpkg.com/react@18.2.0/umd/react.production.min.js","https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"];
  var REACTDOM=["https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js","https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js","https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"];
  var BABEL=["https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js","https://unpkg.com/@babel/standalone@7.24.7/babel.min.js","https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js"];
  loadScript("React", REACT)
    .then(function(){ return loadScript("React DOM", REACTDOM); })
    .then(function(){ return loadScript("compiler", BABEL); })
    .then(function(){
      setStatus("starting…");
      try{ var src=document.getElementById("jsx-src").textContent; var out=Babel.transform(src,{presets:["react"]}).code; (0,eval)(out); }
      catch(e){ showErr((e&&e.stack)||e); }
    })
    .catch(function(e){ showErr(String(e && e.message || e)+"\n\nThis usually means no internet on first launch. Connect once and reopen — after that it works offline."); });
})();
</script>
</body>
</html>
